name: Production infrastructure
on: { workflow_dispatch: { inputs: { apply: { description: 'Apply Terraform plan', required: true, default: 'false', type: choice, options: ['false', 'true'] } } } }
permissions: { contents: read, id-token: write }
concurrency: { group: production, cancel-in-progress: false }
jobs:
  terraform:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ secrets.AWS_DEPLOY_ROLE_ARN }}', aws-region: '${{ vars.AWS_REGION }}' }
      - working-directory: infrastructure/terraform
        run: terraform fmt -check && terraform init -backend-config=backend.hcl && terraform validate
      - working-directory: infrastructure/terraform
        env: { TF_VAR_database_username: '${{ secrets.DATABASE_USERNAME }}', TF_VAR_database_password: '${{ secrets.DATABASE_PASSWORD }}' }
        run: terraform plan -out=tfplan
      - if: inputs.apply == 'true'
        working-directory: infrastructure/terraform
        run: terraform apply -auto-approve tfplan
