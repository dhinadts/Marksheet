[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-marks-ai-service"
version = "0.1.0"
description = "AI-MARKS image processing and inference service"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<5",
  "openai>=1.50,<2",
  "pillow>=11,<13",
  "pillow-heif>=0.20,<2",
  "pydantic>=2.10,<3",
  "redis>=5.2,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.26,<3",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["datasets*", "models*", "notebooks*", "tests*"]
