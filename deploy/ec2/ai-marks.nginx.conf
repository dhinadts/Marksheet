map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name marksheet.dhinadts.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name marksheet.dhinadts.com;

    ssl_certificate /etc/letsencrypt/live/marksheet.dhinadts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marksheet.dhinadts.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name api.dhinadts.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.dhinadts.com;
    client_max_body_size 30m;

    ssl_certificate /etc/letsencrypt/live/www.dhinadts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.dhinadts.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
